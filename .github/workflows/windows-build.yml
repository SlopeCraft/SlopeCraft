name: Windows Build
on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  clang:
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [ Debug, Release ]
        gpu_api: [ None, Vulkan ]
        vectorize: [ true, false ]
        exclude:
          - gpu_api: Vulkan
            vectorize: false
          - gpu_api: Vulkan
            vectorize: false
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      GPU_API: ${{ matrix.gpu_api }}
      VECTORIZE: ${{ matrix.vectorize }}
    steps:
      - name: echo matrix variables (build_type = ${{ matrix.build_type }})
        run: |
          echo "env:BUILD_TYPE = $env:BUILD_TYPE"
          echo "env:GPU_API = $env:GPU_API"

      - name: Install ninja
        shell: cmd
        run: |
          choco install ninja
          ninja --version

      - name: Install deps with vcpkg
        shell: powershell
        run: |
          vcpkg install --triplet=x64-windows boost-uuid boost-multi-array zlib libpng bzip2  liblzma libzip eigen3 xsimd magic-enum gapp

      - name: Install OpenCL with vcpkg
        if: matrix.gpu_api == 'OpenCL'
        run: vcpkg install opencl --triplet=x64-windows

      - name: Install Vulkan with vcpkg
        if: matrix.gpu_api == 'Vulkan'
        run: vcpkg install --triplet=x64-windows glslang[tools] vulkan-headers vulkan-memory-allocator vulkan-loader

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: make dirs
        run: |
          mkdir bin
          mkdir bin/llvm
          mkdir bin/Qt6.10.3-msvc-shared
          mkdir 3rdParty

      - name: Get short SHA
        run: |
          echo "GITHUB_SHA = $env:GITHUB_SHA"
          $short_sha=$env:GITHUB_SHA.substring(0,7)
          echo "short_sha = $short_sha"
          echo "SHORT_SHA=$short_sha" >> $env:GITHUB_ENV

      - name: Download Qt6.10.3-msvc-shared, verify and extract
        shell: cmd
        env:
          # SHA256 of Qt6.10.3-msvc-shared.7z, copied from the asset list on the
          # release page. Re-uploading the archive to the release requires
          # updating this value, otherwise the build fails on purpose.
          QT_ARCHIVE_SHA256: ee5277793d9e5b44409ec69f74092975fa2a59f829b809c9dfdac830e54050e9
        run: |
          cd bin
          curl -fL --retry 5 --retry-delay 10 -o .\Qt6.10.3-msvc-shared.7z "https://github.com/SlopeCraft/QtBinaries/releases/download/qt6.10.3-x86_64-msvc-windows/Qt6.10.3-msvc-shared.7z"
          if "%QT_ARCHIVE_SHA256%"=="ee5277793d9e5b44409ec69f74092975fa2a59f829b809c9dfdac830e54050e9" (
            echo ERROR: QT_ARCHIVE_SHA256 is still the placeholder. Pin the real SHA256 of the archive in windows-build.yml.
            exit /b 1
          )
          certutil -hashfile .\Qt6.10.3-msvc-shared.7z SHA256 | findstr /i /c:"%QT_ARCHIVE_SHA256%" >nul
          if errorlevel 1 (
            echo ERROR: SHA256 of Qt6.10.3-msvc-shared.7z does not match the pinned value.
            echo Expected: %QT_ARCHIVE_SHA256%
            echo Actual:
            certutil -hashfile .\Qt6.10.3-msvc-shared.7z SHA256
            exit /b 1
          )
          7z x -oQt6.10.3-msvc-shared .\Qt6.10.3-msvc-shared.7z

      - name: Download llvm, verify and extract
        shell: cmd
        env:
          # SHA256 of LLVM-22.1.8-win64.exe, copied from the asset list on the
          # release page. Bumping the LLVM version requires updating this value.
          LLVM_INSTALLER_SHA256: 16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c
        run: |
          cd /d bin
          curl -fL --retry 5 --retry-delay 10 -o .\LLVM-22.1.8-win64.exe "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe"
          if "%LLVM_INSTALLER_SHA256%"=="16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c" (
            echo ERROR: LLVM_INSTALLER_SHA256 is still the placeholder. Pin the real SHA256 of the installer in windows-build.yml.
            exit /b 1
          )
          certutil -hashfile .\LLVM-22.1.8-win64.exe SHA256 | findstr /i /c:"%LLVM_INSTALLER_SHA256%" >nul
          if errorlevel 1 (
            echo ERROR: SHA256 of LLVM-22.1.8-win64.exe does not match the pinned value.
            echo Expected: %LLVM_INSTALLER_SHA256%
            echo Actual:
            certutil -hashfile .\LLVM-22.1.8-win64.exe SHA256
            exit /b 1
          )
          7z x .\LLVM-22.1.8-win64.exe -ollvm "-xr!$PLUGINSDIR"
          .\llvm\bin\clang-cl --version
          cd ..
          tree /f D:\a\SlopeCraft\SlopeCraft\bin\llvm

      - name: CMake configure
        shell: cmd
        run: |
          mkdir build
          mkdir install
          .\bin\llvm\bin\clang-cl --version
          set PATH=D:\a\SlopeCraft\SlopeCraft\bin\llvm\bin;C:\Program Files\VulkanSDK\1.3.250.1\Bin;%PATH%
          "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" & cmake -S . -B ./build -G Ninja -DCMAKE_C_COMPILER:FILEPATH="D:/a/SlopeCraft/SlopeCraft/bin/llvm/bin/clang-cl.exe" -DCMAKE_CXX_COMPILER:FILEPATH="D:/a/SlopeCraft/SlopeCraft/bin/llvm/bin/clang-cl.exe" -DCMAKE_RC_COMPILER:FILEPATH="D:/a/SlopeCraft/SlopeCraft/bin/llvm/bin/llvm-rc.exe" -DCMAKE_PREFIX_PATH:PATH="D:/a/SlopeCraft/SlopeCraft/bin/Qt6.10.3-msvc-shared;C:/vcpkg/installed/x64-windows/;D:/a/SlopeCraft/SlopeCraft/3rdParty/libnbt++;C:/Program Files/VulkanSDK/1.3.250.1" -DCMAKE_INSTALL_PREFIX:PATH=D:/a/SlopeCraft/SlopeCraft/install -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" -DSlopeCraft_GPU_API:STRING="${{ matrix.gpu_api }}" -DSlopeCraft_vectorize:BOOL="${{ matrix.vectorize }}" -DSlopeCraft_windeployqt_flags_install:STRING=-release;--no-translations
        #
      - name: CMake build
        shell: cmd
        run: |
          tree ./build
          cmake --build ./build --parallel 10

      - name: CMake install
        shell: cmd
        run: |
          cmake --install ./build

      - name: Make zip and 7z packs with CPack
        run: |
          $basedir=(pwd).path.replace("\\","/")
          cd ./build
          cpack -G ZIP -B "$basedir/pack"
          cpack -G 7Z -B "$basedir/pack"

      #- name: Upload zip pack
      #  uses: actions/upload-artifact@v3
      #  with:
      #    name: SlopeCraft-dev-${{ env.SHORT_SHA }}-${{ matrix.build_type }}-${{ matrix.gpu_api }}-vec=${{ matrix.vectorize }}-windows-clang-zip
      #    path: pack/SlopeCraft*.zip
      #    if-no-files-found: error

      - name: Upload 7z pack
        uses: actions/upload-artifact@v5
        with:
          name: SlopeCraft-dev-${{ env.SHORT_SHA }}-${{ matrix.build_type }}-${{ matrix.gpu_api }}-vec=${{ matrix.vectorize }}-windows-clang-7z
          path: pack/SlopeCraft*.7z
          if-no-files-found: error
          compression-level: 0

