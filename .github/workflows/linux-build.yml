name: Linux Build
on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  clang:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [ Debug, Release ]
        gpu_api: [ None,  Vulkan ]
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      GPU_API: ${{ matrix.gpu_api }}
    steps:
      - name: echo matrix variables (build_type = ${{ matrix.build_type }})
        run: |
          echo $BUILD_TYPE
          echo $GPU_API
      - name: apt update
        run: sudo apt update

      - name: Make directories
        run: mkdir build install pack

      #- name: List installed
      #  run: apt list --installed

      - name: Install cmake, ninja
        run: sudo apt install cmake ninja-build

      - name: Install dependencies
        run:
          sudo apt install clang-20 libomp-20-dev xz-utils bzip2 libzip-dev zipcmp ziptool zipmerge libpng-dev libeigen3-dev libexpected-dev p7zip-full libboost-all-dev libboost-tools-dev libboost-doc coreutils

      - name: Install qt6
        run: |
          sudo apt install libqt6widgets6 libqt6gui6 libqt6network6 qt6-base-dev qt6-tools-dev-tools qt6-tools-dev qt6-l10n-tools
          sudo apt install x11-utils libxcb-xinerama0 libxv1 libgl-dev
        # ^: additional qt-related packages

      - name: Install xsimd
        run: |
          cd build
          git clone https://github.com/xtensor-stack/xsimd.git
          cd xsimd
          git checkout 11.1.0
          cmake -S . -B build-xsimd -G Ninja -DCMAKE_BUILD_TYPE:STRING=$BUILD_TYPE
          sudo cmake --install ./build-xsimd
          cd ..
          rm -rf xsimd

      - name: Install gapp
        run: |
          cd build 
          git clone https://github.com/KRM7/gapp.git
          cd gapp
          git checkout v1.0.1
          cmake -S . -B build-gapp -G Ninja -DCMAKE_BUILD_TYPE:STRING=$BUILD_TYPE -DBUILD_TESTING=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build build-gapp --parallel
          sudo cmake --install build-gapp
          cd ..
          rm -rf gapp


      - name: Install Vulkan SDK
        if: matrix.gpu_api == 'Vulkan'
        env:
          VULKAN_SDK_VERSION: "1.4.363.0"
        run: |
          sudo apt-get install libglm-dev cmake libxcb-dri3-0 libxcb-present0 libpciaccess0 libpng-dev libxcb-keysyms1-dev libxcb-dri3-dev libx11-dev g++ gcc   libwayland-dev libxrandr-dev libxcb-randr0-dev libxcb-ewmh-dev  git python-is-python3 bison libx11-xcb-dev liblz4-dev libzstd-dev ocaml-core ninja-build pkg-config libxml2-dev wayland-protocols python3-jsonschema   clang-format qtbase5-dev qt6-base-dev
          mkdir -p ~/Downloads
          cd ~/Downloads
          archive="vulkansdk-linux-x86_64-$VULKAN_SDK_VERSION.tar.xz"
          wget "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/$archive"
          echo "197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43  $archive" | sha256sum --check --strict -
          tar xf "$archive"
          sudo mv ~/Downloads/"$VULKAN_SDK_VERSION" /opt/vulkan-sdk

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: CMake configure
        run: cmake -S . -B ./build -G Ninja -DCMAKE_PREFIX_PATH:FILEPATH=/opt/vulkan-sdk/x86_64  -DCMAKE_C_COMPILER:FILEPATH=clang-20 -DCMAKE_CXX_COMPILER:FILEPATH=clang++-20 -DCMAKE_INSTALL_PREFIX:PATH=./install -DSlopeCraft_GPU_API:STRING=$GPU_API -DCMAKE_BUILD_TYPE:STRING=$BUILD_TYPE -DMC_SCHEM_HAS_mdspan=OFF

      - name: CMake build
        run: cmake --build ./build --parallel

      - name: CMake install
        run: cmake --install ./build

      - name: Get short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Make deb and tar.xz packs with cpack
        run: |
          cd build
          cpack -G DEB -B ../pack
          cpack -G TXZ -B ../pack
          cd ..

      - name: Upload deb pack
        uses: actions/upload-artifact@v5
        with:
          name: SlopeCraft-dev-${{ env.SHORT_SHA }}-${{ matrix.build_type }}-${{ matrix.gpu_api }}-linux-clang-deb
          path: pack/SlopeCraft*.deb
          if-no-files-found: error
          compression-level: 0

      - name: Upload tar.xz pack
        uses: actions/upload-artifact@v5
        with:
          name: SlopeCraft-dev-${{ env.SHORT_SHA }}-${{ matrix.build_type }}-${{ matrix.gpu_api }}-linux-clang-tar-xz
          path: pack/SlopeCraft*.tar.xz
          if-no-files-found: error
          compression-level: 0

      - name: Run CTest
        if: (matrix.build_type == 'Release')&&(matrix.gpu_api == 'None')
        run: |
          cd ./build
          ctest -j20 --output-on-failure --stop-on-failure
      - name: Test deb pack
        run: sudo dpkg -i ./pack/*.deb
