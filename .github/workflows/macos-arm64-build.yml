name: macOS (Apple Silicon) Build
on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - macOS-CI

jobs:
  clang:
    # macos-26 is the newest GitHub-hosted image that runs natively on Apple
    # Silicon (arm64); "macos-26-intel" is the separate x64 label.
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Debug, Release ]
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      # Vulkan is temporarily disabled on macOS.
      GPU_API: None
      MACOSX_DEPLOYMENT_TARGET: 13.3
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - name: echo matrix variables (build_type = ${{ matrix.build_type }})
        run: |
          echo "BUILD_TYPE = $BUILD_TYPE"
          echo "GPU_API = $GPU_API"
          echo "runner arch = $(uname -m)"
          brew config

      - name: Checkout repository
        uses: actions/checkout@v5

      # On Apple Silicon every dependency below has an arm64 bottle, so nothing
      # here has to be built from source -- unlike the Intel job, where some of
      # these formulae have lost their x86_64 bottles.
      # libomp: the compiler below is Apple clang, whose OpenMP support lives in
      # Homebrew's keg-only libomp -- Apple ships no OpenMP runtime.
      - name: Install dependencies with Homebrew
        run: |
          brew install ninja libzip libpng zstd xz bzip2 boost cereal magic_enum xsimd eigen sevenzip libomp

      # Qt is the one big dependency: if Homebrew ever stops offering an arm64
      # bottle for it, "brew install qt" would silently start compiling Qt from
      # source (hours). In that case, unpack a prebuilt arm64 Qt instead -- the
      # Qt company's official arm64 macOS package -- and put its prefix into
      # CMAKE_PREFIX_PATH below. Keep an eye on the log of this step.
      - name: Install Qt6 with Homebrew
        run: brew install qt

      - name: Show toolchain versions
        run: |
          echo "--- clang (Apple, from the Xcode that ships with the image) ---"
          clang++ --version
          echo "--- libc++ (diagnostic) ---"
          ls -l "$(xcrun --show-sdk-path)/usr/include/c++/v1/string.h" || true
          echo "--- cmake / ninja ---"
          cmake --version
          ninja --version
          echo "--- openmp ---"
          brew --prefix libomp
          ls "$(brew --prefix libomp)/include/omp.h" "$(brew --prefix libomp)/lib/libomp.dylib"
          echo "--- qt ---"
          brew --prefix qt
          "$(brew --prefix qt)/bin/qmake6" -query QT_VERSION
          echo "--- qt deployment target (this is the real floor for the bundles) ---"
          for fw in Core Gui Widgets Network; do
            otool -l "$(brew --prefix qt)/lib/Qt${fw}.framework/Versions/A/Qt${fw}" 2>/dev/null \
              | grep -A3 "LC_BUILD_VERSION" | grep -E "minos|sdk" \
              | sed "s/^/Qt${fw}: /" || echo "Qt${fw}: no LC_BUILD_VERSION"
          done

      - name: Make directories
        run: mkdir -p build install pack

      # Apple clang, not Homebrew clang. The compiler, libc++ and the C library
      # have to come from one vendor: Homebrew's clang brings libc++ 23, whose
      # <cstring>/<cstdio>/... wrappers cannot find the C headers they forward to
      # ("<cstring> tried including <string.h> but didn't find libc++'s <string.h>
      # header"), and pointing those wrappers at the SDK's C headers only trades
      # that failure for a worse one, because Apple's libc++ headers reject a
      # foreign clang (their <cmath> collides with the isinf macro from the SDK's
      # <math.h>). Apple's own toolchain has neither problem, and the image already
      # ships it -- Xcode 26.6, whose libc++ carries the C++23 library this project
      # uses (std::print, std::println, std::expected, std::format).
      #
      # -nostdinc++ plus the SDK's C++ directory spells out that the C++ standard
      # library is Apple's, so a stray Homebrew -isystem cannot silently bring
      # another libc++ back in. The SDK path is asked of xcrun rather than
      # hardcoded, so nothing depends on the installed Xcode version.
      #
      # OpenMP: Apple ships no OpenMP runtime, so the libomp keg installed above
      # provides it -- and that keg is keg-only, which is why FindOpenMP has to be
      # handed the paths instead of being left to guess. CMAKE_PREFIX_PATH does not
      # help here: it serves find_package's package search, not the compiler's
      # header search, so without these variables the probe compiles a file that
      # includes <omp.h>, cannot find it, and reports
      #   "Could NOT find OpenMP_C (missing: OpenMP_C_FLAGS OpenMP_C_LIB_NAMES)".
      # -Xpreprocessor is needed because Apple clang does not accept plain -fopenmp
      # as a driver flag of its own.
      #
      # Deployment target: macOS 13.0, the lowest this can honestly be. Qt 6.11 --
      # the Homebrew build these bundles will carry -- targets macOS 13 and states
      # in its own documentation that lowering the deployment target below Qt's
      # default "will likely lead to crashes at runtime" on the systems it was
      # lowered for. A lower number here would only silence the compiler, not make
      # the result run there, so the number is Qt's floor rather than a wish.
      # (cmake/tool_chain_files/x86_64-mac-to-arm64-mac.cmake in this repo uses 12,
      # which predates Qt 6.11 and is below what the shipped Qt supports.)
      #
      # It is applied through CMAKE_OSX_DEPLOYMENT_TARGET, which makes CMake add
      # -mmacosx-version-min to every compile and link itself; the two probes below
      # pass the same flag explicitly so they are judged on the same terms.
      - name: CMake configure
        run: |
          DEPLOYMENT_FLAGS="-mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET"
          SDK_CXX_INCLUDE="$(xcrun --show-sdk-path)/usr/include/c++/v1"
          test -f "$SDK_CXX_INCLUDE/string.h"
          LIBCXX_FLAGS="-nostdinc++ -isystem $SDK_CXX_INCLUDE"
          LIBOMP_PREFIX="$(brew --prefix libomp)"
          OPENMP_FLAGS="-Xpreprocessor -fopenmp -I${LIBOMP_PREFIX}/include"
          OPENMP_LINK_FLAGS="-L${LIBOMP_PREFIX}/lib -lomp"
          # One-shot checks of what would waste a long build: the C++23 library this
          # project is written against, and the OpenMP keg CMake is about to search.
          # Both are checked at the deployment target below, so a C++23 header that
          # needs a newer macOS fails here instead of deep inside the build.
          printf '%s\n' \
            '#include <cstring>' \
            '#include <format>' \
            '#include <print>' \
            '#include <expected>' \
            'int main() { std::println("{}", 1); return 0; }' > /tmp/toolchain_probe.cpp
          clang++ $LIBCXX_FLAGS $DEPLOYMENT_FLAGS -std=c++23 -fsyntax-only /tmp/toolchain_probe.cpp
          printf '%s\n' '#include <omp.h>' 'int main() { return omp_get_max_threads(); }' > /tmp/openmp_probe.c
          clang $OPENMP_FLAGS $DEPLOYMENT_FLAGS -fsyntax-only /tmp/openmp_probe.c
          cmake -S . -B ./build -G Ninja \
          -DCMAKE_C_COMPILER:FILEPATH="$(xcrun --find clang)" \
          -DCMAKE_CXX_COMPILER:FILEPATH="$(xcrun --find clang++)" \
          -DCMAKE_C_FLAGS:STRING="$LIBCXX_FLAGS" \
          -DCMAKE_CXX_FLAGS:STRING="$LIBCXX_FLAGS" \
          -DCMAKE_OSX_ARCHITECTURES:STRING=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET:STRING=$MACOSX_DEPLOYMENT_TARGET \
          -DOpenMP_C_FLAGS:STRING="$OPENMP_FLAGS" \
          -DOpenMP_CXX_FLAGS:STRING="$OPENMP_FLAGS" \
          -DOpenMP_C_LIB_NAMES:STRING=omp \
          -DOpenMP_CXX_LIB_NAMES:STRING=omp \
          -DOpenMP_omp_LIBRARY:FILEPATH="$LIBOMP_PREFIX/lib/libomp.dylib" \
          -DOpenMP_C_LIBRARIES:STRING="$OPENMP_LINK_FLAGS" \
          -DOpenMP_CXX_LIBRARIES:STRING="$OPENMP_LINK_FLAGS" \
          -DCMAKE_PREFIX_PATH:PATH="$(brew --prefix)" \
          -DCMAKE_INSTALL_PREFIX:PATH="$(pwd)/install" \
          -DCMAKE_BUILD_TYPE:STRING="$BUILD_TYPE" \
          -DSlopeCraft_GPU_API:STRING="None"\
          -DMC_SCHEM_HAS_mdspan=OFF

      - name: CMake build
        run: cmake --build ./build --parallel

      - name: CMake install
        run: cmake --install ./build

      - name: Show dynamic linking
        continue-on-error: true
        run: |
          for exe in \
          install/SlopeCraft.app/Contents/MacOS/SlopeCraft \
          install/SlopeCraft.app/Contents/MacOS/sccl \
          install/VisualCraft.app/Contents/MacOS/VisualCraft \
          install/VisualCraft.app/Contents/MacOS/vccl \
          install/MapViewer.app/Contents/MacOS/MapViewer \
          install/imageCutter.app/Contents/MacOS/imageCutter; do
            echo "==================== $exe"
            echo "--- minimum macOS required by this binary (LC_BUILD_VERSION) ---"
            otool -l "$exe" 2>/dev/null | grep -A3 "LC_BUILD_VERSION" | grep -E "platform|minos|sdk" || true
            otool -L "$exe"
          done

      # project(SlopeCraft VERSION ${SlopeCraft_version}) makes CMake record the version
      # in the cache, so this reads the same number the build used -- no parsing of
      # CMakeLists.txt, and no hard-coded version to forget.
      - name: Get project version from CMake cache
        id: project
        run: |
          VERSION="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/CMakeCache.txt)"
          echo "project version = $VERSION"
          test -n "$VERSION" || { echo "failed to read CMAKE_PROJECT_VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Using large-enough window and sorting by type, greatly reduces archive size (~88M -> ~33MB)
      # Because Qt binaries are deployed 4 times
      - name: Make 7z pack
        run: |
          mkdir -p pack
          cd install
          7z a -t7z -m0=lzma2 -mx=9 -ms=on -md=256m -mqs=on -mmt=on -snl \
            "../pack/SlopeCraft-${{ steps.project.outputs.version }}-macOS-Silicon.7z" ./*

      - name: Get short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Upload 7z pack
        uses: actions/upload-artifact@v5
        with:
          name: SlopeCraft-dev-${{ env.SHORT_SHA }}-${{ matrix.build_type }}-None-macos-arm64-clang-7z
          path: pack/SlopeCraft*.7z
          if-no-files-found: error
          compression-level: 0
