name: macOS (Apple Silicon) Build
on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - macOS-CI

jobs:
  clang:
    # macos-26 is the newest GitHub-hosted image that runs natively on Apple
    # Silicon (arm64); "macos-26-intel" is the separate x64 label.
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Debug, Release ]
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      # Vulkan is temporarily disabled on macOS.
      GPU_API: None
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - name: echo matrix variables (build_type = ${{ matrix.build_type }})
        run: |
          echo "BUILD_TYPE = $BUILD_TYPE"
          echo "GPU_API = $GPU_API"
          echo "runner arch = $(uname -m)"
          brew config

      - name: Checkout repository
        uses: actions/checkout@v4

      # On Apple Silicon every dependency below has an arm64 bottle, so nothing
      # here has to be built from source -- unlike the Intel job, where some of
      # these formulae have lost their x86_64 bottles.
      # libomp: the compiler below is Apple clang, whose OpenMP support lives in
      # Homebrew's keg-only libomp -- Apple ships no OpenMP runtime.
      - name: Install dependencies with Homebrew
        run: |
          brew install ninja libzip libpng zstd xz bzip2 boost cereal magic_enum xsimd eigen sevenzip libomp

      # Qt is the one big dependency: if Homebrew ever stops offering an arm64
      # bottle for it, "brew install qt" would silently start compiling Qt from
      # source (hours). In that case, unpack a prebuilt arm64 Qt instead -- the
      # Qt company's official arm64 macOS package -- and put its prefix into
      # CMAKE_PREFIX_PATH below. Keep an eye on the log of this step.
      - name: Install Qt6 with Homebrew
        run: brew install qt

      - name: Show toolchain versions
        run: |
          echo "--- clang (Apple, from the Xcode that ships with the image) ---"
          clang++ --version
          echo "--- libc++ (diagnostic) ---"
          ls -l "$(xcrun --show-sdk-path)/usr/include/c++/v1/string.h" || true
          echo "--- cmake / ninja ---"
          cmake --version
          ninja --version
          echo "--- openmp ---"
          brew --prefix libomp
          ls "$(brew --prefix libomp)/include/omp.h" "$(brew --prefix libomp)/lib/libomp.dylib"
          echo "--- qt ---"
          brew --prefix qt
          "$(brew --prefix qt)/bin/qmake6" -query QT_VERSION

      - name: Make directories
        run: mkdir -p build install pack

      # Apple clang, not Homebrew clang. The compiler, libc++ and the C library
      # have to come from one vendor: Homebrew's clang brings libc++ 23, whose
      # <cstring>/<cstdio>/... wrappers cannot find the C headers they forward to
      # ("<cstring> tried including <string.h> but didn't find libc++'s <string.h>
      # header"), and pointing those wrappers at the SDK's C headers only trades
      # that failure for a worse one, because Apple's libc++ headers reject a
      # foreign clang (their <cmath> collides with the isinf macro from the SDK's
      # <math.h>). Apple's own toolchain has neither problem, and the image already
      # ships it -- Xcode 26.6, whose libc++ carries the C++23 library this project
      # uses (std::print, std::println, std::expected, std::format).
      #
      # -nostdinc++ plus the SDK's C++ directory spells out that the C++ standard
      # library is Apple's, so a stray Homebrew -isystem cannot silently bring
      # another libc++ back in. The SDK path is asked of xcrun rather than
      # hardcoded, so nothing depends on the installed Xcode version.
      #
      # OpenMP is unaffected: CMake's FindOpenMP drives Apple clang's own
      # -fopenmp support, which uses the libomp keg installed above.
      - name: CMake configure
        run: |
          SDK_CXX_INCLUDE="$(xcrun --show-sdk-path)/usr/include/c++/v1"
          test -f "$SDK_CXX_INCLUDE/string.h"
          LIBCXX_FLAGS="-nostdinc++ -isystem $SDK_CXX_INCLUDE"
          # One-shot check of the two things that would waste a long build: the
          # headers this project includes, and the C++23 library it relies on.
          printf '%s\n' \
            '#include <cstring>' \
            '#include <format>' \
            '#include <print>' \
            '#include <expected>' \
            'int main() { std::println("{}", 1); return 0; }' > /tmp/toolchain_probe.cpp
          clang++ $LIBCXX_FLAGS -std=c++23 -fsyntax-only /tmp/toolchain_probe.cpp
          cmake -S . -B ./build -G Ninja \
          -DCMAKE_C_COMPILER:FILEPATH="$(xcrun --find clang)" \
          -DCMAKE_CXX_COMPILER:FILEPATH="$(xcrun --find clang++)" \
          -DCMAKE_C_FLAGS:STRING="$LIBCXX_FLAGS" \
          -DCMAKE_CXX_FLAGS:STRING="$LIBCXX_FLAGS" \
          -DCMAKE_PREFIX_PATH:PATH="$(brew --prefix)" \
          -DCMAKE_INSTALL_PREFIX:PATH="$(pwd)/install" \
          -DCMAKE_BUILD_TYPE:STRING="$BUILD_TYPE" \
          -DSlopeCraft_GPU_API:STRING="None"

      - name: CMake build
        run: cmake --build ./build --parallel "$(sysctl -n hw.ncpu)"

      - name: CMake install
        run: cmake --install ./build

      - name: Make tar.xz packs with CPack
        run: |
          cd build
          cpack -G TXZ -B ../pack
          cd ..

      - name: Get short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Upload tar.xz pack
        uses: actions/upload-artifact@v4
        with:
          name: SlopeCraft-dev-${{ env.SHORT_SHA }}-${{ matrix.build_type }}-None-macos-arm64-clang-tar-xz
          path: pack/SlopeCraft*.tar.xz
          if-no-files-found: error
          compression-level: 0
