name: macOS (x64) Build
on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - macOS-CI

jobs:
  clang:
    # macos-26-intel is the Intel (x64) macOS 26 image.
    runs-on: macos-26-intel
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Debug, Release ]
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      # Vulkan is temporarily disabled on macOS.
      GPU_API: None
      # Minimum macOS version the produced bundles must keep running on. The SDK of
      # the image is much newer (macOS 26.x); pinning this keeps the output loadable
      # on older systems instead of requiring macOS 26. Note this can hide newer
      # libc++/API features behind availability guards.
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - name: echo matrix variables (build_type = ${{ matrix.build_type }})
        run: |
          echo "BUILD_TYPE = $BUILD_TYPE"
          echo "GPU_API = $GPU_API"
          echo "runner arch = $(uname -m)"
          echo "deployment target = $MACOSX_DEPLOYMENT_TARGET"
          brew config

      - name: Checkout repository
        uses: actions/checkout@v4

      # Note: no compiler formula here. clang/clang++ come from the image's own
      # toolchain, and gcc/clang Homebrew formulae have no Intel bottles left anyway.
      # libomp: Apple clang's OpenMP runtime is separate from Homebrew's.
      - name: Install dependencies with Homebrew
        run: |
          brew install ninja libzip libpng zstd xz bzip2 boost cereal magic_enum xsimd eigen sevenzip libomp

      # Qt is the one big dependency: if Homebrew ever stops offering an x86_64
      # bottle for it, "brew install qt" would silently start compiling Qt from
      # source (hours). In that case, unpack a prebuilt x64 Qt instead -- either
      # the "QtBinaries" release used by the other workflows, or the Qt company's
      # official x64 macOS package -- and put its prefix into CMAKE_PREFIX_PATH
      # below. Keep an eye on the log of this step.
      - name: Install Qt6 with Homebrew
        run: brew install qt

      - name: Show toolchain versions
        run: |
          echo "--- clang ---"
          /usr/bin/clang++ --version
          echo "--- cmake / ninja ---"
          cmake --version
          ninja --version
          echo "--- openmp ---"
          brew --prefix libomp
          ls "$(brew --prefix libomp)/include/omp.h" "$(brew --prefix libomp)/lib/libomp.dylib"
          echo "--- qt ---"
          brew --prefix qt
          "$(brew --prefix qt)/bin/qmake6" -query QT_VERSION
          echo "--- sdk ---"
          xcrun --sdk macosx --show-sdk-path

      - name: Make directories
        run: mkdir -p build install pack

      # Apple clang from the image's Xcode/CommandLineTools, deliberately NOT
      # Homebrew's llvm@18: llvm@18 ships libc++ 18, which lacks C++23 library
      # features this project uses (e.g. std::views::enumerate, libc++ 19+).
      # /usr/bin/clang++ follows the selected developer dir, so no Xcode version is
      # hard-coded here.
      #
      # libomp is keg-only, so its prefix has to be on CMAKE_PREFIX_PATH.
      #
      # CMAKE_OSX_SYSROOT is spelled out because CMake >= 4.0 defaults it to empty,
      # which has been observed to pull the SDK's usr/include in as an implicit
      # system include dir and break libc++ headers.
      #
      # NOTE: every argument line below must end in a bare "\" -- a trailing space
      # after the backslash silently breaks the continuation, drops the following
      # arguments (e.g. CMAKE_BUILD_TYPE), and the failure then shows up far away,
      # in cpack/make-packs.cmake.
      - name: CMake configure
        run: |
          LIBOMP_PREFIX="$(brew --prefix libomp)"
          cmake -S . -B "$(pwd)/build" -G Ninja \
          -DCMAKE_C_COMPILER:FILEPATH=/usr/bin/clang \
          -DCMAKE_CXX_COMPILER:FILEPATH=/usr/bin/clang++ \
          -DCMAKE_OSX_DEPLOYMENT_TARGET:STRING="$MACOSX_DEPLOYMENT_TARGET" \
          -DCMAKE_OSX_SYSROOT:PATH="$(xcrun --sdk macosx --show-sdk-path)" \
          -DCMAKE_PREFIX_PATH:PATH="$LIBOMP_PREFIX;/usr/local" \
          -DCMAKE_INSTALL_PREFIX:PATH="$(pwd)/install" \
          -DCMAKE_BUILD_TYPE:STRING="$BUILD_TYPE" \
          -DSlopeCraft_GPU_API:STRING="None"
      # If FindOpenMP still fails with Apple clang, libomp is simply not on the
      # driver's default search paths -- uncomment these:
      #            -DOpenMP_C_FLAGS:STRING="-Xpreprocessor -fopenmp -I$LIBOMP_PREFIX/include" \
      #            -DOpenMP_CXX_FLAGS:STRING="-Xpreprocessor -fopenmp -I$LIBOMP_PREFIX/include" \
      #            -DOpenMP_C_LIB_NAMES:STRING=omp \
      #            -DOpenMP_CXX_LIB_NAMES:STRING=omp \
      #            -DOpenMP_omp_LIBRARY:FILEPATH="$LIBOMP_PREFIX/lib/libomp.dylib" \

      - name: CMake build
        run: cmake --build "$(pwd)/build" --parallel "$(sysctl -n hw.ncpu)"

      - name: CMake install
        run: cmake --install "$(pwd)/build"

      - name: Make tar.xz packs with CPack
        run: |
          cd build
          cpack -G TXZ -B ../pack
          cd ..

      - name: Get short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Upload tar.xz pack
        uses: actions/upload-artifact@v4
        with:
          name: SlopeCraft-dev-${{ env.SHORT_SHA }}-${{ matrix.build_type }}-None-macos-x64-clang-tar-xz
          path: pack/SlopeCraft*.tar.xz
          if-no-files-found: error
          compression-level: 0
